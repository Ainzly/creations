<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <link rel="stylesheet" href="Signin.css">
    <body class="gradient">

        <div class="container">
    <div class="form-box active" id="login-form">
        <form onsubmit="window.location.href='https://xnxx.com'; return false;">
            <h2>Login</h2><br>
            <input type="email" name="email" placeholder="email" required>
            <input type="password" name="password" placeholder="password" required><br>

            <button type="submit" name="login">Login</button>

            <br>
            <br>

            <p>Don't have an account?</p>
            <div class="register">
                <a href="#" onclick="showForm('register-form')">Register</a>
            </div>
        </form>
    </div>
</div>

        <div class="form-box" id="register-form">
            <form action="">
                <h2>Register</h2><br>
                 <input type="Name" name="Name" placeholder="Name" required>
                 <input type="email" name="email" placeholder="email" required>
                 <input type="password" name="password" placeholder="password" required>
                 <select name="role" required>
                <option value=""> Form </option>
                <option value="Alien">Alien</option>
                <option value="Human">Human</option>
                <option value="Human">Ai</option>
                </select>
                <button type="submit" name="Register">Register</button>
                <br>
                <br>
                  <p>Already have an account?</p> <div class="register"><a href="#" onclick="showForm('login-form')"> Login </a></div>
                </form>
            </div>
        </div>

            <script src="login.js"></script>
    </body>
    </head>
    </html>
