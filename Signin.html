<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic User Profile Creator</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            width: 100%;
            max-width: 800px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 25px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: #222;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Profile Preview Styles */
        .preview-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            min-height: 300px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 5px 0;
            word-break: break-word;
        }

        .profile-title {
            font-size: 1rem;
            color: #666;
            margin: 0 0 15px 0;
            font-style: italic;
            word-break: break-word;
        }

        .profile-bio {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #444;
            margin: 0;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .placeholder-text {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Input Form -->
    <div class="card">
        <h2>Create Profile</h2>
        <form id="profileForm">
            <div class="form-group">
                <label for="nameInput">Full Name</label>
                <input type="text" id="nameInput" placeholder="e.g. Jane Doe" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="titleInput">Job Title</label>
                <input type="text" id="titleInput" placeholder="e.g. Software Engineer" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="bioInput">Short Bio</label>
                <textarea id="bioInput" placeholder="Tell us about yourself..." autocomplete="off"></textarea>
            </div>
        </form>
    </div>

    <!-- Live Preview -->
    <div class="card preview-card">
        <div class="avatar" id="profileAvatar">?</div>
        <h3 class="profile-name" id="profileName"><span class="placeholder-text">Your Name</span></h3>
        <p class="profile-title" id="profileTitle"><span class="placeholder-text">Your Title</span></p>
        <p class="profile-bio" id="profileBio"><span class="placeholder-text">Your bio will appear here as you type.</span></p>
    </div>
</div>

<script>
    // Get DOM elements
    const nameInput = document.getElementById('nameInput');
    const titleInput = document.getElementById('titleInput');
    const bioInput = document.getElementById('bioInput');

    const profileAvatar = document.getElementById('profileAvatar');
    const profileName = document.getElementById('profileName');
    const profileTitle = document.getElementById('profileTitle');
    const profileBio = document.getElementById('profileBio');

    // Event listener for Name input
    nameInput.addEventListener('input', (e) => {
        const value = e.target.value.trim();
        if (value) {
            profileName.textContent = value;
            // Get first letter for avatar
            profileAvatar.textContent = value.charAt(0);
        } else {
            profileName.innerHTML = '<span class="placeholder-text">Your Name</span>';
            profileAvatar.textContent = '?';
        }
    });

    // Event listener for Title input
    titleInput.addEventListener('input', (e) => {
        const value = e.target.value.trim();
        if (value) {
            profileTitle.textContent = value;
        } else {
            profileTitle.innerHTML = '<span class="placeholder-text">Your Title</span>';
        }
    });

    // Event listener for Bio input
    bioInput.addEventListener('input', (e) => {
        const value = e.target.value;
        if (value.trim()) {
            profileBio.textContent = value;
        } else {
            profileBio.innerHTML = '<span class="placeholder-text">Your bio will appear here as you type.</span>';
        }
    });
</script>

</body>
</html>

</body>
</html>
